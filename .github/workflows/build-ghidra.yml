name: Build Ghidra

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest]

    runs-on: ${{ matrix.platform }}
    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
  
      - name: Read Ghidra JDK Version
        run: echo "JDK_VER=$(awk -F'=' '$1=="application.java.min" {print $2}' Ghidra/application.properties)" >> $GITHUB_ENV 

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '${{ env.JDK_VER }}'

      - name: Fetch Dependencies
        run: ./gradlew -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      - name: Stamp fork revision
        run: printf '\napplication.fork.revision=%s\n' "$GITHUB_SHA" >> Ghidra/application.properties

      - name: Build Ghidra
        run: ./gradlew buildGhidra --parallel

      - name: Publish pinned Linux distribution
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive=(build/dist/ghidra_*.zip)
          test "${#archive[@]}" -eq 1
          mv "${archive[0]}" build/dist/ghidra-linux.zip
          mkdir -p build/dist/python
          unzip -j build/dist/ghidra-linux.zip '*/Ghidra/Features/PyGhidra/pypkg/dist/pyghidra-*.whl' -d build/dist/python
          sha256sum build/dist/ghidra-linux.zip > build/dist/SHA256SUMS
          gh release create "wizardry-$GITHUB_SHA" \
            build/dist/ghidra-linux.zip build/dist/SHA256SUMS build/dist/python/*.whl \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Wizardry Ghidra $GITHUB_SHA (Linux)" \
            --notes "Linux distribution built from agluszak/ghidra commit $GITHUB_SHA, including the fork's native comparison fixes."
